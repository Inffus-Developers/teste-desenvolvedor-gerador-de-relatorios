version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inffus_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=testeinffus
      - DB_USERNAME=root
      - DB_PASSWORD=root
    networks:
      - inffus_network

  nginx:
    image: nginx:alpine
    container_name: inffus_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend
    networks:
      - inffus_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inffus_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - inffus_network

  mysql:
    image: mysql:8.0
    container_name: inffus_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=testeinffus
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - inffus_network

networks:
  inffus_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
