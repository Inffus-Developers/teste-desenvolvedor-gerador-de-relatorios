services:
  # 1. Banco de Dados MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: billing_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: billing_system
      MYSQL_USER: billing_user
      MYSQL_PASSWORD: billing_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - billing_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Backend PHP 8.4-FPM (Laravel)
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: billing_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      TZ: America/Sao_Paulo
      PHP_MEMORY_LIMIT: 512M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - billing_network

  # 3. Servidor Web Nginx
  nginx:
    image: nginx:alpine
    container_name: billing_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - billing_network

# 4. Frontend Next.js / React (Node 20)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: billing_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - "NEXT_PUBLIC_API_URL=http://localhost:8000/api"
      - "TZ=America/Sao_Paulo"
    networks:
      - billing_network

volumes:
  db_data:
    driver: local

networks:
  billing_network:
    driver: bridge